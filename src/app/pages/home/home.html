<!-- Contenedor general de la página. -->
<section class="home">
  <!-- Saludo al usuario logueado. Solo se pinta cuando ya tenemos su perfil (/me);
       mientras carga o si no hay sesión NO mostramos nada (saludo aditivo, sin parpadeo).
       Si la fila aún no tiene nombre (auto-provisionada), saludamos genérico. -->
  @if (user(); as u) {
    <p class="home__greeting">{{ u.name ? 'Hola, ' + u.name : 'Hola' }}</p>
  }

  <!-- Título principal. -->
  <h1 class="home__title">Bubble Teas</h1>

  <!-- Zona de acciones de la página: botón para crear uno nuevo. -->
  <div class="home__actions">
    <app-ui-button label="Crear nuevo bubble-tea" (clicked)="crear()" />
  </div>

  <!-- Grid responsive: recorremos la lista y pintamos una tarjeta por cada tea. -->
  <!-- track tea.id -> usamos el id (único) para que Angular optimice el repintado. -->
  <div class="home__grid">
    @for (tea of bubbleTeas(); track tea.id) {
      <!-- [tea] -> le pasamos el objeto. (viewDetails/edit/delete) -> escuchamos -->
      <!-- sus eventos y llamamos al método correspondiente con el tea recibido. -->
      <app-bubble-tea-card
        [tea]="tea"
        (viewDetails)="verDetalles($event)"
        (edit)="editar($event)"
        (delete)="borrar($event)" />
    }
    <!-- Si la lista está vacía, mostramos un mensaje. -->
    @empty {
      <p class="home__empty">No hay bubble teas para mostrar.</p>
    }
  </div>
</section>
